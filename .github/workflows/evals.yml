name: evals

# Runs the skill evals when the assets they exercise change. Not a required
# check: a path-filtered workflow that doesn't run would leave a required
# check pending forever. It reports; people decide.
on:
  pull_request:
    paths:
      - skills/**
      - commands/**
      - agents/**
      - tests/evals/**
      - tests/fixtures/**
      - justfile
      - .github/workflows/evals.yml
  workflow_dispatch:
    inputs:
      cases:
        description: Space-separated case names (default is every case)
        required: false
      repeats:
        description: Runs per case
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Secrets are withheld from fork PRs; skip with a notice instead of failing.
      - name: Check for credentials
        id: creds
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not available (fork PR or secret not set); skipping evals."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.run == 'true'
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.creds.outputs.run == 'true'
      - uses: extractions/setup-just@v4
        if: steps.creds.outputs.run == 'true'

      - name: Run evals
        if: steps.creds.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          INPUT_CASES: ${{ inputs.cases }}
          INPUT_REPEATS: ${{ inputs.repeats }}
        run: |
          # A token pasted from a wrapped terminal line can contain a newline.
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$CLAUDE_CODE_OAUTH_TOKEN"
          export CLAUDE_CODE_OAUTH_TOKEN
          args=(--repeats "${INPUT_REPEATS:-3}")
          if [ -n "${INPUT_CASES:-}" ]; then
            for c in $INPUT_CASES; do args+=(--case "$c"); done
          elif [ "$EVENT" = "pull_request" ]; then
            args+=(--changed-from "origin/$BASE_REF")
          fi
          just eval "${args[@]}"

      - name: Upload transcripts
        if: always() && steps.creds.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eval-transcripts
          path: tests/evals/out/
          retention-days: 7
          if-no-files-found: ignore
